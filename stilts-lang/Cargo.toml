[package]
name = "stilts-lang"
version = "0.4.0"
edition = "2024"

[features]
serde = ["dep:serde"]

[dependencies]
camino = "1"
proc-macro2.workspace = true
serde = { workspace = true, optional = true }
syn.workspace = true
stilts-parser = { path = "../stilts-parser", version = "0.4", features = ["extra-traits", "serde"] }
