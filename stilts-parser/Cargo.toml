[package]
name = "stilts-parser"
description = "The parser for stilts"
version = "0.4.0"
edition = "2021"
license = "MIT"

[features]
sync-state = []
extra-traits = ["syn/extra-traits"]
debug = ["winnow/debug"]
serde = ["dep:serde"]

[dependencies]
aho-corasick = "1.1"
bitflags = "2.6"
miette.workspace = true
proc-macro2.workspace = true
serde = { workspace = true, optional = true }
syn.workspace = true
thiserror = "1.0"
winnow = { workspace = true, features = ["simd"] }

[dev-dependencies]
pretty_assertions.workspace = true
