[package]
name = "stilts-macros"
version = "0.3.3"
description = "The macros that generate the templates for stilts"
edition = "2021"
license = "MIT"

[lib]
proc-macro = true

[features]
debug = ["stilts-parser/debug"]
narratable = []
fancy = ["miette/fancy"]
actix-web = []
axum = []
gotham = []
rocket = []
warp = []

[dependencies]
# required for macro parsing and expansion
syn.workspace = true
proc-macro2.workspace = true
quote = "1"

# parser for the stilts language
stilts-parser = { path = "../stilts-parser", version = "0.4", features = ["extra-traits"] }
# stilts language utils
stilts-lang = { path = "../stilts-lang", version = "0.4", features = ["serde"] }

# libraries to enable certain useful features
serde = { workspace = true, features = ["derive"] }
cargo_metadata = "0.23"
miette.workspace = true
mime_guess = { version = "2.0", default-features = false }
